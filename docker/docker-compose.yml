version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smileflow-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smileflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: smileflow-redis
    restart: unless-stopped
    # Voice session and idempotency state live here, keyed by a value the
    # caller influences. Without a ceiling that is a remote memory-exhaustion
    # vector; with the default `noeviction` policy a full Redis starts refusing
    # writes, which takes voice down for every instance at once.
    #
    # volatile-lru rather than allkeys-lru: every key this application writes
    # carries a TTL, so the bound is the same, but a key written later without
    # one cannot be silently evicted.
    #
    # THIS FILE CONFIGURES LOCAL AND CI ONLY. A production Redis must be given
    # the same limits by whoever operates it — see the README.
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ../
      dockerfile: apps/api/docker/Dockerfile
    container_name: smileflow-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smileflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-smileflow-dev-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-smileflow-dev-refresh-key-change-in-production}
      JWT_EXPIRATION: 15m
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
      - /app/node_modules
    command: npm run dev

  # Frontend Web
  web:
    build:
      context: ../
      dockerfile: apps/web/docker/Dockerfile
    container_name: smileflow-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
