name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smileflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci

      # The API suite runs against a real database, so the schema has to exist
      # and the demo roles/users have to be seeded before any test runs.
      # `migrate deploy` rather than `migrate dev` — CI must not author migrations.
      - name: Prepare test database
        run: |
          npx prisma generate --schema apps/api/prisma/schema.prisma
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smileflow_test?schema=public

      # Service containers cannot override the image command, so the memory
      # ceiling is applied at runtime instead. It has to match docker-compose:
      # the resource-bound tests assert against the configured policy, and a
      # default `noeviction` Redis would let them pass for the wrong reason.
      # Service containers cannot override the image command, so the memory
      # ceiling is applied at runtime instead. It has to match docker-compose:
      # the resource-bound tests assert against the configured policy, and a
      # default `noeviction` Redis would let them pass for the wrong reason.
      #
      # Uses the client npm ci already installed — runners carry no redis-cli.
      - name: Configure Redis memory policy
        run: |
          node -e "
            const { Redis } = require('ioredis');
            const r = new Redis('redis://localhost:6379');
            (async () => {
              await r.config('SET', 'maxmemory', '256mb');
              await r.config('SET', 'maxmemory-policy', 'volatile-lru');
              const [, policy] = await r.config('GET', 'maxmemory-policy');
              const [, max] = await r.config('GET', 'maxmemory');
              console.log('maxmemory-policy =', policy, '| maxmemory =', max);
              if (policy !== 'volatile-lru' || Number(max) === 0) {
                throw new Error('Redis memory policy not applied');
              }
              await r.quit();
            })().catch((e) => { console.error(e.message); process.exit(1); });
          "

      - run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smileflow_test?schema=public
          JWT_SECRET: test-secret-key-for-ci
          JWT_REFRESH_SECRET: test-refresh-key-for-ci
          REDIS_URL: redis://localhost:6379
          # A fixed, non-secret value: the suite needs a stable HMAC key, and
          # this one protects nothing because no real code is ever hashed here.
          OTP_HMAC_SECRET: test-otp-hmac-secret-for-ci
          # Off, and no Twilio credentials anywhere in this job. CI never
          # places a call and never sends an SMS: every phone test drives a
          # fake sender and a fake socket, the same rule that keeps CI talking
          # to Anthropic and nobody else. A credential here would be one an
          # attacker could bill.
          VOICE_PHONE_ENABLED: 'false'
          SMS_PROVIDER: logging

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      # The Nest build needs the generated Prisma client types.
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
